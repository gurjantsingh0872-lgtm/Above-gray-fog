<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>The Stranger in the Mirror</title>
    <meta name="theme-color" content="#0b070e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b070e;
        --gold: #c99a52;
        --dim: #8d8190;
        --red: #8a1a2c;
        box-sizing: border-box;
      }
      :root:not([data-theme="light"]) {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        background: var(--bg);
        color: #e6dccd;
        font-family: "Pixelify Sans", "Courier New", monospace;
      }
      #app {
        max-width: 680px;
        margin: 0 auto;
        padding: 10px;
      }
      h1 {
        font-size: 18px;
        margin: 4px 0 8px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 1px;
      }
      #wrap {
        position: relative;
      }
      canvas {
        width: 100%;
        display: block;
        image-rendering: pixelated;
        border: 4px solid #2a2034;
        border-radius: 6px;
        background: #000;
      }
      #dlg {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: none;
        background: linear-gradient(#1d1624, #100b16);
        color: #e6dccd;
        border: 3px solid #8e8aa4;
        border-radius: 10px;
        box-shadow: inset 0 0 0 2px #4a1622;
        padding: 10px 14px 12px;
        font-size: 16px;
        line-height: 1.35;
        min-height: 78px;
        cursor: pointer;
      }
      #who {
        position: absolute;
        left: 12px;
        top: -15px;
        background: var(--red);
        color: #fff;
        padding: 1px 10px;
        border-radius: 6px 6px 0 0;
        font-size: 13px;
      }
      #nx {
        position: absolute;
        right: 12px;
        bottom: 6px;
        font-size: 12px;
        color: var(--gold);
        animation: b 1s steps(2) infinite;
      }
      @keyframes b {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #nx {
          animation: none;
        }
      }
      #tx.fi {
        animation: fi 0.6s ease-out;
      }
      .nar {
        color: #9a8fa0;
        font-style: italic;
      }
      @keyframes fi {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tx.fi {
          animation: none;
        }
      }
      #start {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        background: radial-gradient(circle at 50% 40%, #2a0f1a, #07040a 70%);
        border-radius: 6px;
      }
      #start h2 {
        margin: 0;
        font-size: clamp(20px, 6vw, 34px);
        color: #e6dccd;
        letter-spacing: 2px;
        text-shadow: 0 0 12px #8a1a2c;
      }
      #start p {
        margin: 0;
        color: var(--dim);
        font-size: 14px;
      }
      button {
        font: inherit;
      }
      #go {
        padding: 10px 28px;
        font-size: 18px;
        background: var(--red);
        color: #fff;
        border: 2px solid #c8a0a8;
        border-radius: 8px;
        cursor: pointer;
      }
      #go:focus-visible,
      #snd:focus-visible,
      #pad button:focus-visible {
        outline: 2px solid var(--gold);
      }
      #hud {
        margin: 8px 0;
        font-size: 14px;
        color: var(--dim);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      #snd {
        background: #1d1624;
        color: var(--dim);
        border: 1px solid #3a2f48;
        border-radius: 6px;
        padding: 2px 8px;
        font-size: 12px;
      }
      #pad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 6px;
      }
      #pad button {
        height: 48px;
        font-size: 18px;
        background: #1d1624;
        color: #e6dccd;
        border: 2px solid #3a2f48;
        border-radius: 8px;
        touch-action: manipulation;
      }
      #pad button:active {
        background: #3a2a44;
      }
      small {
        color: var(--dim);
        display: block;
        margin-top: 8px;
        font-size: 13px;
      }

      /* ---- full screen + controller layout ---- */
      :root {
        --vh: calc(
          100dvh - env(safe-area-inset-top, 0px) -
            env(safe-area-inset-bottom, 0px)
        );
      }
      html,
      body {
        height: 100%;
        width: 100%;
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-touch-callout: none;
        background: #000;
      }
      #app {
        position: fixed;
        inset: 0;
        max-width: none;
        margin: 0;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #000;
      }
      #wrap {
        flex: none;
        aspect-ratio: 5/3;
        width: min(100%, calc((var(--vh) - 240px) * 5 / 3));
      }
      canvas {
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 0;
      }
      #dlg {
        font-size: max(14px, calc(var(--u, 1.5px) * 8));
        min-height: max(70px, calc(var(--u, 1.5px) * 36));
      }
      #start {
        border-radius: 0;
        gap: 8px;
      }
      #start .cr {
        font-size: 11px;
        opacity: 0.7;
      }
      #top {
        position: absolute;
        left: 6px;
        right: 6px;
        top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        font-size: clamp(11px, 1.4vmin + 5px, 15px);
        color: #d8ccd6;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #top .r {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #obj,
      #cl {
        background: rgba(10, 6, 14, 0.62);
        padding: 2px 8px;
        border-radius: 6px;
      }
      #obj:empty {
        display: none;
      }
      #top button {
        pointer-events: auto;
        width: 30px;
        height: 30px;
        padding: 0;
        background: rgba(10, 6, 14, 0.62);
        color: #d8ccd6;
        border: 1px solid #4a3c5c;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
      }
      #top button:focus-visible {
        outline: 2px solid var(--gold);
      }
      #gp {
        display: none;
      }
      #hint {
        display: none;
        color: var(--dim);
        font-size: 12px;
        margin-top: 6px;
      }
      #pad {
        display: none;
        flex: 1;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        padding: 6px 26px 16px;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body.touch #pad {
        display: flex;
      }
      @media (orientation: portrait) {
        body.touch #hint {
          display: block;
        }
      }
      #dpad {
        position: relative;
        width: 132px;
        height: 132px;
        touch-action: none;
      }
      #dpad i {
        position: absolute;
        width: 44px;
        height: 44px;
        background: rgba(36, 26, 46, 0.88);
        border: 2px solid #4a3c5c;
        color: #cfc4d0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-style: normal;
        font-size: 18px;
        border-radius: 8px;
      }
      #dpad .u {
        left: 44px;
        top: 0;
      }
      #dpad .d {
        left: 44px;
        bottom: 0;
      }
      #dpad .l {
        left: 0;
        top: 44px;
      }
      #dpad .r {
        right: 0;
        top: 44px;
      }
      #dpad .m {
        left: 44px;
        top: 44px;
        border-radius: 0;
      }
      #dpad[data-on="U"] .u,
      #dpad[data-on="D"] .d,
      #dpad[data-on="L"] .l,
      #dpad[data-on="R"] .r {
        background: var(--red);
        border-color: #c8a0a8;
      }
      #a {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: var(--red);
        color: #fff;
        border: 3px solid #c8a0a8;
        font-size: 26px;
        font-weight: 700;
        touch-action: none;
        cursor: pointer;
      }
      #a:active {
        background: #b02a40;
        transform: scale(0.95);
      }
      @media (orientation: landscape) {
        #app {
          justify-content: center;
        }
        #wrap {
          width: min(100%, calc(var(--vh) * 5 / 3));
        }
        body.touch #pad {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          flex: none;
          pointer-events: none;
          padding: 0 calc(16px + env(safe-area-inset-right, 0px))
            calc(14px + env(safe-area-inset-bottom, 0px))
            calc(16px + env(safe-area-inset-left, 0px));
        }
        #dpad,
        #a {
          pointer-events: auto;
          opacity: 0.62;
        }
        #dpad {
          width: 120px;
          height: 120px;
        }
        #dpad i {
          width: 40px;
          height: 40px;
        }
        #dpad .u {
          left: 40px;
        }
        #dpad .d {
          left: 40px;
        }
        #dpad .l {
          top: 40px;
        }
        #dpad .r {
          top: 40px;
        }
        #dpad .m {
          left: 40px;
          top: 40px;
        }
        #a {
          width: 68px;
          height: 68px;
        }
        body.talk #dpad {
          opacity: 0.15;
          pointer-events: none;
        }
      }
      #card {
        position: absolute;
        inset: 0;
        z-index: 5;
        background: #05030a;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 10px 6%;
        gap: 4px;
        cursor: pointer;
        overflow: hidden;
      }
      #card.on {
        opacity: 1;
        pointer-events: auto;
      }
      #card .c1 {
        color: var(--gold);
        font-size: max(10px, calc(var(--u, 1.5px) * 5.5));
        letter-spacing: 2px;
      }
      #card .c2 {
        font-size: max(17px, calc(var(--u, 1.5px) * 10));
        font-weight: 700;
        color: #e6dccd;
      }
      #card p {
        margin: 4px 0;
        color: #9a8fa0;
        font-style: italic;
        font-size: max(11px, calc(var(--u, 1.5px) * 5.8));
        line-height: 1.4;
        max-width: 94%;
      }
      #card .c3 {
        color: var(--gold);
        font-size: 11px;
        opacity: 0;
        animation: b 1s steps(2) infinite;
      }
      #card.ok .c3 {
        opacity: 1;
      }
      #inv {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 3, 10, 0.82);
      }
      #inv.on {
        display: flex;
      }
      .ip {
        width: min(92%, 440px);
        max-height: 92%;
        overflow: auto;
        background: linear-gradient(#1d1624, #100b16);
        border: 3px solid #8e8aa4;
        border-radius: 10px;
        box-shadow: inset 0 0 0 2px #4a1622;
        padding: 8px 12px;
        color: #e6dccd;
        font-size: max(12px, calc(var(--u, 1.5px) * 6.4));
      }
      .ih {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--gold);
        margin-bottom: 4px;
      }
      #ix {
        background: none;
        border: 1px solid #4a3c5c;
        border-radius: 6px;
        color: #cfc4d0;
        width: 28px;
        height: 28px;
        cursor: pointer;
      }
      .it {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 5px 0;
        border-top: 1px solid #3a2f48;
      }
      .it img {
        width: 32px;
        height: 32px;
        image-rendering: pixelated;
        flex: none;
      }
      .it b {
        display: block;
        color: #efe6d8;
        font-weight: 500;
      }
      .it span {
        color: #9a8fa0;
        font-size: 0.92em;
        line-height: 1.3;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 38px;
        transform: translateX(-50%);
        z-index: 4;
        background: rgba(10, 6, 14, 0.88);
        border: 1px solid var(--gold);
        color: var(--gold);
        padding: 3px 10px;
        border-radius: 6px;
        font-size: max(11px, calc(var(--u, 1.5px) * 5.8));
        opacity: 0;
        transition: opacity 0.4s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.on {
        opacity: 1;
      }
      #bag {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="wrap">
        <canvas id="c" width="320" height="192"></canvas>
        <div id="top">
          <span id="obj"></span
          ><span class="r"
            ><span id="gp" title="Controller connected">🎮</span
            ><span id="cl">Clues 0/3</span
            ><button id="bag" aria-label="Open inventory">🎒</button
            ><button id="snd" aria-label="Toggle sound">🔊</button
            ><button id="fs" aria-label="Toggle full screen">⛶</button></span
          >
        </div>
        <div id="dlg">
          <span id="who"></span><span id="tx"></span><span id="nx">▼</span>
        </div>
        <div id="toast"></div>
        <div id="inv">
          <div class="ip">
            <div class="ih">
              <span>Inventory</span
              ><button id="ix" aria-label="Close inventory">✕</button>
            </div>
            <div id="il"></div>
          </div>
        </div>
        <div id="card"></div>
        <div id="start">
          <p>A fan-made story</p>
          <h2>The Stranger<br />in the Mirror</h2>
          <p>Headphones recommended</p>
          <button id="go">Begin</button>
          <p class="cr" id="ios"></p>
          <p class="cr">Fan-made tribute · original dialogue</p>
        </div>
      </div>
      <div id="hint">Rotate your phone sideways for a bigger screen</div>
      <div id="pad">
        <div id="dpad" aria-hidden="true">
          <i class="u">▲</i><i class="l">◀</i><i class="m"></i><i class="r">▶</i
          ><i class="d">▼</i>
        </div>
        <button id="a" data-k="E" aria-label="Talk or examine">A</button>
      </div>
    </div>
    <script>
      const S = 16,
        cv = document.getElementById("c"),
        g = cv.getContext("2d"),
        dlg = document.getElementById("dlg"),
        tx = document.getElementById("tx"),
        who = document.getElementById("who"),
        nx = document.getElementById("nx"),
        objEl = document.getElementById("obj");
      let c = g;
      const R = (col, x, y, w, h) => {
        c.fillStyle = col;
        c.fillRect(Math.round(x), Math.round(y), w, h);
      };
      const OUT = "#0e0a12",
        B = (x, y, w, h, f, hi) => {
          R(OUT, x, y, w, h);
          R(f, x + 1, y + 1, w - 2, h - 2);
          if (hi) R(hi, x + 1, y + 1, w - 2, 1);
        };
      const hs = (x, y) => {
        let n = (x * 374761393 + y * 668265263) ^ 0x5bd1e995;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        return (((n ^ (n >>> 16)) >>> 0) % 1000) / 1000;
      };
      const Z = "Zhou Mingrui",
        M = "Klein’s memories";
      /* ---------- audio ---------- */
      let AC,
        master,
        NB,
        snd = 1,
        hb = 0,
        bp = 0;
      function audioInit() {
        if (AC) return;
        try {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          master = AC.createGain();
          master.gain.value = 0.5;
          master.connect(AC.destination);
          const f = AC.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = 150;
          f.connect(master);
          const gd = AC.createGain();
          gd.gain.value = 0.07;
          gd.connect(f);
          [55, 55.6, 82.4].forEach((fr) => {
            const o = AC.createOscillator();
            o.type = "sawtooth";
            o.frequency.value = fr;
            o.connect(gd);
            o.start();
          });
          const lf = AC.createOscillator(),
            lg = AC.createGain();
          lf.frequency.value = 0.07;
          lg.gain.value = 60;
          lf.connect(lg);
          lg.connect(f.frequency);
          lf.start();
          NB = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
          const d = NB.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          setInterval(whisper, 7000);
        } catch (e) {}
      }
      function whisper() {
        if (!AC || !snd) return;
        const s = AC.createBufferSource();
        s.buffer = NB;
        s.loop = true;
        const b = AC.createBiquadFilter();
        b.type = "bandpass";
        b.frequency.value = 1200 + Math.random() * 1500;
        b.Q.value = 9;
        const gn = AC.createGain(),
          t = AC.currentTime;
        gn.gain.setValueAtTime(0, t);
        gn.gain.linearRampToValueAtTime(0.05, t + 1.2);
        gn.gain.linearRampToValueAtTime(0, t + 2.6);
        s.connect(b);
        b.connect(gn);
        gn.connect(master);
        s.start(t);
        s.stop(t + 2.8);
      }
      function thump(dl) {
        if (!AC || !snd) return;
        const t = AC.currentTime + dl,
          o = AC.createOscillator(),
          gn = AC.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(70, t);
        o.frequency.exponentialRampToValueAtTime(35, t + 0.18);
        gn.gain.setValueAtTime(0.8, t);
        gn.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.connect(gn);
        gn.connect(master);
        o.start(t);
        o.stop(t + 0.3);
      }
      function blip() {
        if (!AC || !snd) return;
        const t = AC.currentTime,
          o = AC.createOscillator(),
          gn = AC.createGain();
        o.type = "square";
        o.frequency.value = 300 + Math.random() * 60;
        gn.gain.setValueAtTime(0.015, t);
        gn.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        o.connect(gn);
        gn.connect(master);
        o.start(t);
        o.stop(t + 0.06);
      }
      function step() {
        if (!AC || !snd) return;
        const s = AC.createBufferSource();
        s.buffer = NB;
        const f = AC.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.value = 380;
        const gn = AC.createGain();
        gn.gain.value = 0.12;
        s.connect(f);
        f.connect(gn);
        gn.connect(master);
        s.start(0, Math.random(), 0.06);
      }
      setInterval(() => {
        if (hb) {
          thump(0);
          thump(0.2);
          bp = 1;
        }
      }, 1300);
      document.getElementById("snd").onclick = (e) => {
        snd = 1 - snd;
        e.target.textContent = snd ? "🔊" : "🔇";
        if (master) master.gain.value = snd ? 0.5 : 0;
      };
      /* ---------- data ---------- */
      let O = [
        {
          id: "nb",
          k: 1,
          tiles: [[9, 4]],
          lines: [
            [
              "",
              "The notebook lies open. Its black letters wobble, blur, and settle into words you can read, though you never learned them.",
            ],
            [
              Z,
              "It is a warning: everyone dies, the writer included. Why does that make my skin crawl?",
            ],
            [
              "",
              "The air seems to murmur, like a ghost story told too close to your ear.",
            ],
          ],
        },
        {
          id: "ink",
          tiles: [[10, 4]],
          lines: [
            [
              "",
              "A bottle glows faint red, an angel embossed on the glass. The pen beside it has its cap off.",
            ],
          ],
        },
        {
          id: "gun",
          k: 1,
          tiles: [[11, 4]],
          lines: [
            [
              Z,
              "A brass revolver in old European style. Klein’s family barely gets by.",
            ],
            [
              Z,
              "So how did he afford this? And why is it sitting next to a warning?",
            ],
          ],
        },
        {
          id: "hp",
          k: 1,
          tiles: [[12, 4]],
          lines: [
            [
              "",
              "A thick red handprint is smeared on the table’s edge. Your own hand is wet and dark.",
            ],
            [Z, "Did I crack my head open on this desk? I need a mirror."],
          ],
        },
        {
          id: "books",
          tiles: [[8, 4]],
          lines: [
            [
              "",
              "Eight books, stacked with care. The titles look foreign, yet you understand every word.",
            ],
          ],
        },
        {
          id: "lamp",
          w: 1,
          tiles: [[7, 3]],

      /* ---------- lighting + atmosphere ---------- */

      /* ---------- touch d-pad (slide your thumb between directions) ---------- */
      const dp = document.getElementById("dpad");

      function setDir(d) {
        if (d === hd) return;

          key(d);
          hiv = setInterval(() => key(d), 50);

      function dirAt(e) {
        const r = dp.getBoundingClientRect(),
          x = e.clientX - r.left - r.width / 2,
          y = e.clientY - r.top - r.height / 2;
        if (Math.hypot(x, y) < r.width * 0.12) return null;
        return Math.abs(x) > Math.abs(y)

            : "R"

        if (hd !== null || e.buttons || e.pressure > 0) setDir(dirAt(e));

        dp.addEventListener(v, () => setDir(null)),
